# books.zh.church 正式主機 nginx 設定(2026-10-07 結構正規化後更新)
# 主機:見內部文件(本 repo 公開,不寫 IP),站點根 /home/ubuntu/books(git clone),web root = public/,PHP 8.3-FPM
# 啟用後:sudo nginx -t && sudo systemctl reload nginx
#
# ★ 與舊版最大差異:root 指到 public/,而不是專案根。
#   config/、app/、tools/、crawler/、database/、docs/、.git 全在 root 之外,
#   瀏覽器物理上就拿不到 → 不再需要 deny 黑名單(漏一條就外洩的那種防線)。
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name books.zh.church;

    root /home/ubuntu/books/public;
    index index.php index.html index.htm;
    client_max_body_size 500M;

    error_log  /var/log/nginx/books.zh.church-error.log;
    access_log /var/log/nginx/books.zh.church-access.log;

    ssl_certificate     /home/ubuntu/ssl/zh.church.crt;
    ssl_certificate_key /home/ubuntu/ssl/zh.church.key;

    # 安全標頭(檢核點 4;Asana 1216467657098295)
    # CSP 白名單:GA(googletagmanager／google-analytics)、Google Fonts;圖片允許任何 https(封面在 R2,
    # 少數仍指來源站)。頁面有內嵌 <script>(GA 設定、JSON-LD、前端程式)與 style 屬性,所以留 'unsafe-inline'。
    # 2026-10-14 驗證:本機代理把正式站回應加上這組標頭,無頭 Chrome 開 / /book/105584 /about.html
    #   /changelog.php /?category=9 皆 0 違規、首頁正常列出書目;對照組 script-src 'self' 會擋 12 處(證明有在檢查)。
    # ★ location 區塊裡若自己寫了 add_header,這裡的就不會繼承 —— 之後在 location 加標頭要連這三條一起抄。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    rewrite ^/book/(\d+)$ /book.php?id=$1 last;

    # REST API 入口(不能用 fastcgi-php.conf,它會對虛擬路徑回 404)
    location ^~ /api {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /home/ubuntu/books/public/api/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PWA manifest 正確 MIME(避免 octet-stream)
    location = /assets/site.webmanifest {
        default_type application/manifest+json;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 點開頭的檔案一律擋(.git 已不在 root 下,這條是縱深防禦)
    location ~ /\. {
        deny all;
    }
}
