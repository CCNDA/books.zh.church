# books.zh.church nginx 設定範本
# 放到 /etc/nginx/sites-available/books.zh.church
# 啟用:ln -s /etc/nginx/sites-available/books.zh.church /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
# 注意:root 與 fastcgi_pass 的 PHP 版本要依主機實際狀況修改

server {
    listen 80;
    listen [::]:80;
    server_name books.zh.church;

    # ★ 改成你 FTP 上傳的專案根目錄(內含 api/、web/、config/)
    root /var/www/books;

    index index.html index.php;
    charset utf-8;

    # REST API:/api/* 全部交給前端控制器 api/index.php
    location /api/ {
        try_files $uri /api/index.php$is_args$args;
    }
    location = /api {
        return 301 /api/;
    }

    # PWA manifest 正確 MIME(避免 octet-stream)
    location = /assets/site.webmanifest {
        default_type application/manifest+json;
    }

    # 前端(web/ 目錄為靜態檔)
    location / {
        try_files $uri $uri/ /web/$uri =404;
    }

    # PHP-FPM(★ 版本依主機:ls /run/php/ 看實際 sock 檔名)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # 禁止外部存取敏感目錄
    location ~ ^/(config|database|crawler|docs|tools|\.git) {
        deny all;
        return 404;
    }
}
