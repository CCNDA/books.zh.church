# books.zh.church 正式主機 nginx 設定(2026-10-07 結構正規化後更新)
# 主機:172.237.12.60,站點根 /home/ubuntu/books(git clone),web root = public/,PHP 8.3-FPM
# 啟用後:sudo nginx -t && sudo systemctl reload nginx
#
# ★ 與舊版最大差異:root 指到 public/,而不是專案根。
#   config/、app/、tools/、crawler/、database/、docs/、.git 全在 root 之外,
#   瀏覽器物理上就拿不到 → 不再需要 deny 黑名單(漏一條就外洩的那種防線)。
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name books.zh.church;

    root /home/ubuntu/books/public;
    index index.php index.html index.htm;
    client_max_body_size 500M;

    error_log  /var/log/nginx/books.zh.church-error.log;
    access_log /var/log/nginx/books.zh.church-access.log;

    ssl_certificate     /home/ubuntu/ssl/zh.church.crt;
    ssl_certificate_key /home/ubuntu/ssl/zh.church.key;

    rewrite ^/book/(\d+)$ /book.php?id=$1 last;

    # REST API 入口(不能用 fastcgi-php.conf,它會對虛擬路徑回 404)
    location ^~ /api {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /home/ubuntu/books/public/api/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PWA manifest 正確 MIME(避免 octet-stream)
    location = /assets/site.webmanifest {
        default_type application/manifest+json;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 點開頭的檔案一律擋(.git 已不在 root 下,這條是縱深防禦)
    location ~ /\. {
        deny all;
    }
}
