# books.zh.church 正式主機 nginx 設定(2026-07-15 由熊哥主機實際設定同步)
# 主機:172.237.12.60,站點根 /home/ubuntu/books,PHP 8.3-FPM
# 啟用後:sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name books.zh.church;
    root /home/ubuntu/books;
    index index.php index.html index.htm;
    client_max_body_size 500M;
    error_log /var/log/nginx/books.zh.church-error.log;
    access_log /var/log/nginx/books.zh.church-access.log;
    ssl_certificate /home/ubuntu/ssl/zh.church.crt;
    ssl_certificate_key /home/ubuntu/ssl/zh.church.key;
    rewrite ^/book/(\d+)$ /book.php?id=$1 last;
    # REST API 入口(不能用 fastcgi-php.conf,它會對虛擬路徑回 404)
    location ^~ /api {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /home/ubuntu/books/api/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
    }
    # 禁止外部讀取設定/資料庫/工具目錄(config 有 DB 密碼;tools 有匯入與封面腳本)
    location ~ ^/(config|database|crawler|docs|tools|\.git) {
        deny all;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    # PWA manifest 正確 MIME(避免 octet-stream)
    location = /assets/site.webmanifest {
        default_type application/manifest+json;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location ~ /\.ht {
        deny all;
    }
}
